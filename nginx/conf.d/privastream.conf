server {
    # Nginx escucha estrictamente en interface local (Loopback).
    # Cloudflared debe apuntar HTTP trafic hacia 127.0.0.1:8080.
    listen 8080;
    server_name localhost; 

    # Seguridad: Capturamos la verdadera IP desde Cloudflare
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    # Security Headers recomendados DevSecOps
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; media-src 'self' blob:; connect-src 'self';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # -------------------------------------------------------------
    # FRONTEND LAYER (SPA / Static Builds)
    # -------------------------------------------------------------
    location / {
        # Si tienes React o Vue exportado, la ruta sería /var/www/privastream/frontend/dist
        root /var/www/privastream/frontend/dist;
        try_files $uri $uri/ /index.html;
        
        # Cache policy (básico)
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # -------------------------------------------------------------
    # BACKEND LAYER (API REST / WebSocket)
    # -------------------------------------------------------------
    location /api/ {
        # Limitacion DDoS de capa 7 a la API (ver zone api_limit en nginx.conf)
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://127.0.0.1:3000; # Asumimos backend en 3000
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade; # Soporte WebSockets para real-time
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        proxy_set_header X-Real-IP $realip_remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------
    # UPLOAD MEDIA PROCESS (Seguridad Extra)
    # -------------------------------------------------------------
    location /api/upload {
        # Mayor restriccion de rate litming para subidas pesadas
        limit_req zone=upload_limit burst=5 nodelay;
        
        client_max_body_size 5000M; 
        
        # Deshabilitar timeout rapidos durante subidas largas
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    # -------------------------------------------------------------
    # MEDIA DELIVERING LAYER (HLS / DASH Optimization)
    # -------------------------------------------------------------
    location /media/ {
        # Este directorio almacenará el video final y sus chunks (.m3u8 .ts)
        alias /var/www/privastream/media/;
        
        # Deshabilitar ejecución o proxying accidental
        location ~ \.(php|sh|pl|py|cgi)$ { return 403; }

        # Optimización específica de streaming y cross origin
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin *; # Solo si el player está ofuscado fuera, o remover

        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
            video/mp4 mp4;
            audio/mpeg mp3;
        }

        # Permitir file ranges para seek en video
        add_header Accept-Ranges bytes;

        # Activar aio for asynchronous chunk reading
        aio threads;
    }

    # Manejar errores de denegación sin mostrar version Nginx
    error_page 403 /403.html;
    location = /403.html {
        return 403 "Forbidden by Security Policy\n";
    }
}
